name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-arm64:
    # The project pins the Linux ARM64 AAPT2 artifact for native ARM64 builds.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses

      - name: Verify imported upstream project and large assets
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/runtime/arm64-v8a/*
          if grep -R -l '^version https://git-lfs.github.com/spec/v1' app/src/main/assets; then
            echo "::error::Git LFS pointer files remain; runtime assets were not materialized."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arch-KDE-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
